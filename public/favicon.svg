  <defs>
    <!-- Base vertical color transition -->
    <linearGradient id="base" x1="102" y1="24" x2="102" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F94F8A"/>
      <stop offset="0.28" stop-color="#E83DE2"/>
      <stop offset="0.68" stop-color="#8B38E7"/>
      <stop offset="1" stop-color="#4026D9"/>
