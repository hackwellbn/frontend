      <stop offset="0.55" stop-color="#D83CEB" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#B735E9" stop-opacity="0"/>
    </radialGradient>

    <!-- Pink/red highlight around the upper-right crown -->
