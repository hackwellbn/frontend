      <stop offset="0.7" stop-color="#F347B6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F347B6" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep blue-violet toward the lower-right -->
    <radialGradient id="blue" cx="0" cy="0" r="1"
        gradientUnits="userSpaceOnUse"
        gradientTransform="translate(162 145) rotate(155) scale(88 95)">
      <stop offset="0" stop-color="#3E27D8" stop-opacity="0.82"/>
      <stop offset="0.72" stop-color="#5330E0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5330E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

